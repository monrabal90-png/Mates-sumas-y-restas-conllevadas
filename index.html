<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué quieres estudiar?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#2d2a4a;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.3;background:linear-gradient(180deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%) fixed;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:18px 14px}
.hero{text-align:center;margin:10px 0 20px}
.mascot{font-size:84px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-size:32px;margin:6px 0 0;line-height:1.05}
.hero p{margin:6px 0 0;font-weight:600;opacity:.8}
a.sub{display:block;text-decoration:none;color:#fff;border-radius:28px;padding:20px 16px;margin-bottom:18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.22)}
a.sub:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
a.mates{background:#ff7a45}
a.anim{background:#0e8b8f}
.ic{font-size:64px;display:block;line-height:1.1}
.t{font-size:28px;font-weight:700;display:block}
.d{font-size:16px;opacity:.92;display:block}
.p{display:inline-block;margin-top:10px;background:rgba(255,255,255,.25);border-radius:99px;padding:4px 14px;font-size:15px;font-weight:600}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="mascot">🦊</div>
    <h1>¿Qué quieres estudiar?</h1>
    <p>Què vols estudiar?</p>
  </div>
  <a class="sub mates" href="mates.html">
    <span class="ic">🔢</span><span class="t">Mates</span>
    <span class="d">Sumas y restas: agrupa y desagrupa</span>
    <span class="p" id="pm">¡Empieza la aventura!</span>
  </a>
  <a class="sub anim" href="animals.html">
    <span class="ic">🦋</span><span class="t">Els animals</span>
    <span class="d">Unitat 2 · Coneixement del Medi</span>
    <span class="p" id="pa">Comença a jugar!</span>
  </a>
</main>
<script>
try{
  var m=JSON.parse(localStorage.getItem("sr_game_v2")||"null");
  if(m&&m.stars){var s=0,k;for(k in m.stars)s+=m.stars[k];if(s||m.coins)document.getElementById("pm").textContent="⭐ "+s+" · 🪙 "+(m.coins||0)}
}catch(e){}
try{
  var a=JSON.parse(localStorage.getItem("animals26")||"null");
  if(a&&a.pts)document.getElementById("pa").textContent="⭐ "+a.pts+" · 🎟️ "+((a.stk||[]).length)+"/20";
}catch(e){}
</script>
</body>
</html>
