<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparación del examen</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--ink:#2d2a4a;--mut:#6f6a8f;--line:#e5defa;--pri:#ff7a45;--priD:#d9531e;--blue:#3b82f6;--blueD:#1f5ec9;--green:#22b573}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.3;background:linear-gradient(180deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%) fixed;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:14px}
.hide{display:none!important}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 rgba(45,42,74,.12)}
.center{text-align:center}
h1{font-size:30px;margin:0;line-height:1.05}
h2{font-size:21px;margin:0 0 4px}
p{margin:4px 0}
.mut{color:var(--mut);font-size:15px}
.hero{display:flex;gap:12px;align-items:center}
.mascot{font-size:56px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mascot.sm{font-size:40px;animation:none}
.mascot.big{font-size:84px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{background:#fff6d6;border-radius:99px;padding:6px 14px;font-weight:700}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 18px;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--priD);cursor:pointer;width:100%;margin-top:12px}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blueD)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.sm{width:auto;padding:8px 14px;font-size:15px;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{font:inherit;font-weight:700;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 6px;cursor:pointer}
.seg button.on{border-color:var(--pri);background:#fff0e8}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lv{font:inherit;color:var(--ink);background:#f5f2ff;border:0;border-radius:16px;padding:10px 4px;box-shadow:0 4px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .ic{font-size:34px}
.lv small{color:var(--mut)}
.lv.lock{opacity:.55}
.lv .stl{font-size:15px;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.tbar{position:relative;height:26px;border-radius:99px;background:#eee9ff;overflow:hidden;margin-top:10px}
#tfill{height:100%;background:var(--green);width:100%;transition:width .25s linear}
#tfill.low{background:#ef4444}
#ttxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.say{display:flex;gap:8px;align-items:center;margin-top:12px}
.bubble{flex:1;border:3px solid #7dd3fc;background:#e0f2fe;border-radius:18px;padding:10px 12px;font-weight:600;font-size:16px;min-height:62px;display:flex;align-items:center}
.bubble.ok{background:#dcfce7;border-color:#86efac}
.bubble.doubt{background:#fef3c7;border-color:#fcd34d}
#board{display:grid;gap:6px;margin:14px 0 4px;align-items:center}
.chip{color:#fff;font-weight:700;font-size:14px;text-align:center;border-radius:8px;padding:3px 0}
.cell{height:56px;min-width:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:14px;background:#faf8ff;font:700 30px "Fredoka",monospace;color:var(--ink);padding:0;position:relative;text-align:center}
.cell.sm{height:40px;font-size:22px;color:var(--blue)}
.cell.big2{font-size:22px}
.cell.tap{border:3px dashed var(--blue);cursor:pointer;background:#eef4ff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(59,130,246,.25)}}
.cell .ghost{opacity:.5}
.cell .old{position:absolute;top:1px;left:6px;font-size:13px;text-decoration:line-through;color:var(--mut)}
input.cell{width:100%}
input.cell:focus{outline:none;border-color:var(--pri);background:#fff}
.sg{text-align:center;font:700 26px "Fredoka",monospace;color:var(--mut)}
.ln{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--ink)}
.bigstars{font-size:46px;letter-spacing:4px;margin:6px 0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf span{position:absolute;top:-50px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.tops{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.qtext{font-size:19px;font-weight:600;margin:10px 0}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{font:inherit;font-weight:600;color:var(--ink);background:#f5f2ff;border:0;border-radius:14px;padding:12px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.opt:disabled{opacity:.5}
.qin{width:100%;font:700 26px "Fredoka",monospace;text-align:center;padding:12px;border:3px solid var(--line);border-radius:14px;margin:8px 0}
.qin:focus{outline:none;border-color:var(--pri)}
.chart{width:100%;height:auto;display:block;margin:4px 0}
.big{display:grid;grid-template-columns:66px 1fr;column-gap:12px;align-items:center;width:100%;text-align:left;font:inherit;border:0;border-radius:24px;padding:16px;margin-bottom:14px;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.big .bi{grid-row:1/3;font-size:48px;text-align:center;line-height:1}
.big .bt{font-size:27px;font-weight:700;line-height:1.1}
.big .bd{font-size:16px;opacity:.95}
.bpurple{background:#8a4fd6}
.bval{font-size:56px;font-weight:700;text-align:center;line-height:1.1}
.bsum{text-align:center;color:var(--mut);font-weight:600;margin-bottom:6px}
.bgoalbar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bgoalbar div{height:100%;background:var(--green);transition:width .3s}
.bcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.bcol{background:#faf8ff;border-radius:14px;padding:6px 4px;text-align:center;min-height:200px}
.bhd{color:#fff;font-weight:700;border-radius:8px;padding:2px 0;font-size:14px}
.bcnt{font-size:12px;color:var(--mut);margin:4px 0}
.barea{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:flex-end}
.blku{width:16px;height:16px;background:#2f6fe4;border-radius:3px}
.blkd{width:16px;height:56px;border-radius:3px;cursor:pointer;background:repeating-linear-gradient(#1f9d55 0 5px,#168553 5px 6px)}
.blkc{width:48px;height:48px;border-radius:4px;cursor:pointer;background-color:#d64545;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4.8px 4.8px}
.blkm{width:56px;height:56px;border-radius:6px;cursor:pointer;background:#8a4fd6;box-shadow:inset -6px -6px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.3)}
.gbtn{font-size:13px;padding:8px 2px;margin-top:6px;animation:pulse 1.4s ease-in-out infinite}
.bgreen{background:#22b573}.borange{background:#ff7a45}.bblue{background:#3b82f6}
.calc{border:3px dashed var(--line);border-radius:18px;padding:10px;margin-top:14px;background:#faf8ff}
.clab{font-weight:700;font-size:16px;margin-bottom:8px}
.cw{margin-bottom:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr) 14px minmax(0,1fr) 22px;gap:4px;align-items:center}
.ci{width:100%;min-width:0;height:46px;font:700 20px "Fredoka",monospace;text-align:center;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:0}
.ci:focus{outline:none;border-color:var(--pri)}
.cop{height:46px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 24px "Fredoka",sans-serif;cursor:pointer;padding:0;margin:0;width:100%}
.ceq{text-align:center;font-weight:700}
.cst{font-size:16px;text-align:center}
.cpre{font:700 20px "Courier New",monospace;white-space:pre;background:#fff;border-radius:10px;padding:6px 10px;margin-top:6px;display:inline-block}
.cbt{display:flex;gap:6px;flex-wrap:wrap}
.cin{border:2px dashed var(--blue)!important;background:#eef4ff!important}
.cell.sm.cin{height:34px;font-size:18px}
.cg{display:grid;gap:4px;align-items:center}
.cg input.cell{height:44px;font-size:24px}
.cg input.cell.sm{height:34px;font-size:18px}
.csheet{background:#fff;border-radius:14px;padding:8px;margin-bottom:8px}
.clab2{font-weight:700;font-size:14px;color:var(--mut);margin-bottom:4px}
.cst2{min-height:22px;font-weight:700;font-size:15px;margin-top:4px;text-align:center}
.vop{font:700 30px "Courier New",monospace;white-space:pre;text-align:center;background:#faf8ff;border-radius:14px;padding:10px 16px;margin:8px auto;display:table;line-height:1.25}
.fstage{position:relative;margin:0 auto;border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--line)}
.fstage span{position:absolute;line-height:1;transform:translate(-50%,-50%);white-space:nowrap}
.ftabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ftab{font:inherit;font-weight:700;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer}
.ftab.on{border-color:var(--pri);background:#fff0e8}
.lv.worn{outline:3px solid var(--green)}
.chint{font-size:13px;color:var(--mut);margin-bottom:6px}
.cg input.cell.xed{text-decoration:line-through;color:var(--mut);background:#f3eefc}
.cg div.cell{height:44px;font-size:24px}
.cwrap{position:relative}
.cwrap input.cell{width:100%}
.old2{position:absolute;top:1px;left:5px;font-size:12px;text-decoration:line-through;color:var(--mut);pointer-events:none}
.alab{font-weight:700;margin-top:10px}
.sbar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.sbar div{height:100%;background:var(--green);transition:width .3s}
.scard{background:#fff;border:0;border-top:10px solid var(--pri);border-radius:20px;padding:16px;text-align:center;box-shadow:0 5px 0 var(--line);margin-bottom:12px}
.sic{font-size:60px;line-height:1.1}
.stx{font-size:19px;font-weight:600;margin-top:8px;text-align:left}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:reduce){.mascot,.cell.tap,.conf span{animation:none}}


.homelink{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;background:#fff;color:#2d2a4a;font:700 15px "Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;text-decoration:none;border-radius:99px;padding:9px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2);border:2px solid #e5defa}
.homelink:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
main{padding-bottom:76px!important}

.sbig{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:22px;padding:16px;color:#fff;font:inherit;text-align:left;cursor:pointer;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.sbig:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.sbig .bi{font-size:46px}.sbig .bt{font-size:22px;font-weight:700;display:block}.sbig .bd{display:block;font-size:15px;opacity:.95}
.orow .oh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.orow .on{background:var(--pri);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.orow .oh b{flex:1}.pc{font-weight:700;color:var(--mut)}
.snav .btn{width:100%}
.orow2{display:grid;grid-template-columns:1fr 64px 42px;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.orow2 .sbar{margin:0}
.wr{border-top:2px dashed var(--line);padding:10px 0}
.wr .ok2{color:var(--ok,#1f9d55);font-weight:700;margin:4px 0}
.wr .vop{font-size:22px;padding:6px 10px}
.opts{display:grid;gap:8px;margin-top:10px}
</style>
</head>
<body>
<main><div id="app"></div></main>
<div class="conf" id="conf"></div>
<a class="homelink" href="index.html">🏠 Menú</a>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var NP=["unidades","decenas","centenas","unidades de millar","decenas de millar"];
  var SP=["unidad","decena","centena","unidad de millar","decena de millar"];
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function digits(n){return String(n).split("").reverse().map(Number)}
  function el(cls,txt){var d=document.createElement("div");d.className=cls;if(txt!==undefined)d.textContent=txt;return d}
  function setMsg(t,k,id){var m=$(id||"msg");m.textContent=t;m.className="bubble "+(k||"info")}
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function fmt(n){return n>=1000?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"."):String(n)}
  function confetti(){
    var box=$("conf"),em=["🎉","⭐","✨","🎈","🪙"],i;
    box.textContent="";
    for(i=0;i<24;i++){var s=document.createElement("span");s.textContent=em[i%5];s.style.left=rnd(0,94)+"%";s.style.animationDelay=(Math.random()*0.6)+"s";s.style.fontSize=rnd(18,34)+"px";box.appendChild(s)}
    setTimeout(function(){box.textContent=""},2900);
  }
  function vert(nums,op,res){
    var f=nums.map(fmt),all=res!==undefined?f.concat([fmt(res)]):f,w=Math.max.apply(null,all.map(function(x){return x.length}))+1,out=[];
    f.forEach(function(x,i){out.push((i===f.length-1?op:" ")+x.padStart(w," "))});
    out.push("—".repeat(w+1));
    if(res!==undefined)out.push(" "+fmt(res).padStart(w," "));
    return out.join("\n");
  }
  function calcPanel(){
    var box=el("calc"),sheets=el("csheets"),W=5,LBL=["DM","UM","C","D","U"],CLR=["#a8650a","#8a4fd6","#d64545","#1f9d55","#2f6fe4"],cnt=0;
    box.appendChild(el("clab","✏️ Zona de cálculo: haz tu cuenta en vertical"));
    box.appendChild(sheets);
    function row(g,cls,dir,wr){
      var arr=[],k,i2,w;arr.wr=[];
      for(k=0;k<W;k++){
        i2=document.createElement("input");i2.className="cell "+cls;i2.inputMode="numeric";i2.maxLength=1;i2.autocomplete="off";
        i2.oninput=(function(idx){return function(){
          this.value=this.value.replace(/\D/g,"").slice(-1);
          if(this.value&&dir!=="n"){var nx=arr[dir==="r"?idx+1:idx-1];if(nx)nx.focus()}
          g.upd();
        }})(k);
        i2.onkeydown=(function(idx){return function(e){
          if(e.key==="Backspace"&&this.value===""&&dir!=="n"){var pv=arr[dir==="r"?idx-1:idx+1];if(pv)pv.focus()}
        }})(k);
        if(wr){w=el("cwrap");w.appendChild(i2);w.appendChild(el("old2"));g.appendChild(w);arr.wr.push(w)}else g.appendChild(i2);
        arr.push(i2);
      }
      return arr;
    }
    function sheet(n){
      var wrap=el("csheet"),g=el("cg"),st=el("cst2"),hint=el("chint","Casillas de arriba: escribe lo que te llevas."),
          sgn="+",third=false,des=false,orig=[],cur=[],ovals=[],t3=[],r1,r2,r3,rs,cr,sb,b3,bd,k,p;
      function dv(a,q){var v=a[W-1-q].value;return v===""?0:+v}
      function val(a){return a.map(function(x){return x.value}).join("")}
      function origNum(){var t=0,q;for(q=0;q<W;q++)t+=orig[q]*Math.pow(10,q);return t}
      function needs(q){
        if(q<0)return false;
        if(cur[q]<dv(r2,q))return true;
        if(cur[q]===0&&q>=1)return needs(q-1);
        return false;
      }
      function paint(){
        var kk,q;
        for(kk=0;kk<W;kk++){
          q=W-1-kk;
          r1[kk].value=(ovals[kk]===""&&cur[q]===0)?"":String(cur[q]);
          r1.wr[kk].children[1].textContent=(ovals[kk]!==""&&cur[q]!==orig[q])?String(orig[q]):"";
        }
      }
      function enterDes(){
        var q,kk;
        if(val(r1)===""||val(r2)===""){hint.textContent="Primero escribe los dos números en sus columnas.";return false}
        for(kk=0;kk<W;kk++)ovals[kk]=r1[kk].value;
        for(q=0;q<W;q++){orig[q]=dv(r1,q);cur[q]=orig[q]}
        des=true;r1.forEach(function(x){x.readOnly=true});
        return true;
      }
      function exitDes(){
        var kk;
        des=false;
        for(kk=0;kk<W;kk++){r1[kk].readOnly=false;r1[kk].value=ovals[kk]||"";r1.wr[kk].children[1].textContent=""}
      }
      function tapA(kk){
        var q=W-1-kk;
        if(!des||q<1)return;
        if(cur[q]<1){hint.textContent="Aquí no queda nada para desagrupar. Prueba con otra casilla de la izquierda.";return}
        if(!needs(q-1)){hint.textContent="🤔 ¿Seguro? Aquí todavía no hace falta desagrupar. Fíjate en qué columna no puedes restar.";return}
        cur[q]--;cur[q-1]+=10;
        paint();
        hint.textContent="✨ Has desagrupado 1 "+SP[q]+" en 10 "+NP[q-1]+".";
        g.upd();
      }
      function mode(){
        var m=sgn==="−";
        cr.forEach(function(x){x.style.visibility=m?"hidden":"visible"});
        bd.style.display=m?"":"none";
        bd.textContent="🔓 Desagrupar un número";
        hint.textContent=m?"Escribe los números. Si no puedes restar una columna, pulsa Desagrupar y toca el número de la izquierda.":"Casillas de arriba: escribe lo que te llevas.";
      }
      wrap.appendChild(el("clab2","Cuenta "+n+" · escribe cada cifra en su columna"));wrap.appendChild(hint);
      g.style.gridTemplateColumns="26px repeat("+W+",minmax(0,1fr))";
      g.appendChild(el("sg"));
      LBL.forEach(function(t,i){var c=el("chip",t);c.style.background=CLR[i];g.appendChild(c)});
      g.appendChild(el("sg"));cr=row(g,"sm cin","n");
      g.appendChild(el("sg"));r1=row(g,"","r",true);
      r1.forEach(function(x,i){x.onclick=function(){if(des)tapA(i)}});
      sb=document.createElement("button");sb.type="button";sb.className="cop";sb.textContent="+";
      sb.onclick=function(){sgn=sgn==="+"?"−":"+";sb.textContent=sgn;if(des)exitDes();mode();g.upd()};
      g.appendChild(sb);r2=row(g,"","r");
      var s3=el("sg","+");g.appendChild(s3);r3=row(g,"","r");
      t3=[s3].concat(r3);
      t3.forEach(function(x){x.style.display="none"});
      g.appendChild(el("ln"));
      g.appendChild(el("sg"));rs=row(g,"","l");
      g.upd=function(){
        var A=des?String(origNum()):val(r1),B=val(r2),T=val(r3),C=val(rs),r;
        st.textContent="";
        if(A!==""&&B!==""&&C!==""&&(!third||T!=="")){
          r=(sgn==="+"?(+A)+(+B):(+A)-(+B))+(third?(+T):0);
          st.textContent=r===(+C)?"✔ Tu cuenta sale bien":"🤔 Revisa tu cuenta";
        }
      };
      wrap.appendChild(g);wrap.appendChild(st);
      bd=document.createElement("button");bd.type="button";bd.className="btn ghost sm";bd.style.display="none";
      bd.onclick=function(){
        if(!des){if(enterDes()){bd.textContent="✏️ Volver a escribir";hint.textContent="Toca un número de arriba (a la izquierda de la columna que no puedes restar) para desagruparlo."}}
        else{exitDes();bd.textContent="🔓 Desagrupar un número";hint.textContent="Escribe los números. Si no puedes restar una columna, pulsa Desagrupar y toca el número de la izquierda."}
        g.upd();
      };
      wrap.appendChild(bd);
      b3=document.createElement("button");b3.type="button";b3.className="btn ghost sm";b3.textContent="➕ Tercer número";
      b3.onclick=function(){third=!third;t3.forEach(function(x){x.style.display=third?"":"none"});b3.textContent=third?"➖ Quitar tercer número":"➕ Tercer número";g.upd()};
      wrap.appendChild(b3);
      wrap.res=function(){var t=val(rs);return t===""?null:(+t)};

      case"prac":start(p[1],"prac",p[2]);break;
      case"mock":start(p[1],"mock");break;
      case"next":nextQ();break;
      case"check":answer();break;
      case"hint":hint();break;
    }
  });
  load();home();

})();
