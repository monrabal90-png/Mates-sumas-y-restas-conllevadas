<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventura Numérica</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d2a4a;--mut:#6f6a8f;--line:#e5defa;--pri:#ff7a45;--priD:#d9531e;--blue:#3b82f6;--blueD:#1f5ec9;--green:#22b573}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.3;background:linear-gradient(180deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%) fixed;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:14px}
.hide{display:none!important}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 rgba(45,42,74,.12)}
.center{text-align:center}
h1{font-size:30px;margin:0;line-height:1.05}
h2{font-size:21px;margin:0 0 4px}
p{margin:4px 0}
.mut{color:var(--mut);font-size:15px}
.hero{display:flex;gap:12px;align-items:center}
.mascot{font-size:56px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mascot.sm{font-size:40px;animation:none}
.mascot.big{font-size:84px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{background:#fff6d6;border-radius:99px;padding:6px 14px;font-weight:700}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 18px;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--priD);cursor:pointer;width:100%;margin-top:12px}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blueD)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.sm{width:auto;padding:8px 14px;font-size:15px;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{font:inherit;font-weight:700;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 6px;cursor:pointer}
.seg button.on{border-color:var(--pri);background:#fff0e8}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lv{font:inherit;color:var(--ink);background:#f5f2ff;border:0;border-radius:16px;padding:10px 4px;box-shadow:0 4px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .ic{font-size:34px}
.lv small{color:var(--mut)}
.lv.lock{opacity:.55}
.lv .stl{font-size:15px;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.tbar{position:relative;height:26px;border-radius:99px;background:#eee9ff;overflow:hidden;margin-top:10px}
#tfill{height:100%;background:var(--green);width:100%;transition:width .25s linear}
#tfill.low{background:#ef4444}
#ttxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.say{display:flex;gap:8px;align-items:center;margin-top:12px}
.bubble{flex:1;border:3px solid #7dd3fc;background:#e0f2fe;border-radius:18px;padding:10px 12px;font-weight:600;font-size:16px;min-height:62px;display:flex;align-items:center}
.bubble.ok{background:#dcfce7;border-color:#86efac}
.bubble.doubt{background:#fef3c7;border-color:#fcd34d}
#board{display:grid;gap:6px;margin:14px 0 4px;align-items:center}
.chip{color:#fff;font-weight:700;font-size:14px;text-align:center;border-radius:8px;padding:3px 0}
.cell{height:56px;min-width:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:14px;background:#faf8ff;font:700 30px "Fredoka",monospace;color:var(--ink);padding:0;position:relative;text-align:center}
.cell.sm{height:40px;font-size:22px;color:var(--blue)}
.cell.big2{font-size:22px}
.cell.tap{border:3px dashed var(--blue);cursor:pointer;background:#eef4ff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(59,130,246,.25)}}
.cell .ghost{opacity:.5}
.cell .old{position:absolute;top:1px;left:6px;font-size:13px;text-decoration:line-through;color:var(--mut)}
input.cell{width:100%}
input.cell:focus{outline:none;border-color:var(--pri);background:#fff}
.sg{text-align:center;font:700 26px "Fredoka",monospace;color:var(--mut)}
.ln{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--ink)}
.bigstars{font-size:46px;letter-spacing:4px;margin:6px 0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf span{position:absolute;top:-50px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mascot,.cell.tap,.conf span{animation:none}}
</style>
<style>
.homelink{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;background:#fff;color:#2d2a4a;font:700 15px "Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;text-decoration:none;border-radius:99px;padding:9px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2);border:2px solid #e5defa}
.homelink:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
main{padding-bottom:76px!important}
</style>
</head>
<body>
<main>

<section id="s-home">
  <div class="card">
    <div class="hero"><div class="mascot">🦊</div><div><h1>Aventura Numérica</h1><p class="mut">¡Agrupa y desagrupa para ganar estrellas!</p></div></div>
    <div class="pills"><span class="pill" id="tstars">⭐ 0</span><span class="pill" id="tcoins">🪙 0</span></div>
    <div class="seg">
      <button id="m-calm">🌱 Tranquilo</button>
      <button id="m-time">⏱ Contrarreloj</button>
    </div>
    <p class="mut center" id="mdesc"></p>
  </div>
  <div class="card">
    <h2>➕ Mundo de las Sumas</h2>
    <p class="mut">Cuando una columna llega a 10, ¡agrupa!</p>
    <div class="lvs" id="lv-sum"></div>
  </div>
  <div class="card">
    <h2>➖ Mundo de las Restas</h2>
    <p class="mut">Cuando no puedes restar, ¡desagrupa!</p>
    <div class="lvs" id="lv-sub"></div>
  </div>
  <p class="mut center" id="hnote" style="color:#fff;font-weight:600"></p>
  <div class="center"><button class="btn ghost sm" id="wipe">Borrar mi progreso</button></div>
</section>

<section id="s-play" class="hide">
  <div class="card">
    <div class="top"><span id="pw"></span><span id="pc"></span></div>
    <div class="top mut" style="font-weight:600"><span id="pop"></span><span id="pmode"></span></div>
    <div class="tbar hide" id="tbar"><div id="tfill"></div><span id="ttxt"></span></div>
    <div class="say"><div class="mascot sm">🦊</div><div class="bubble" id="msg"></div></div>
    <div id="board"></div>
    <button class="btn" id="check">✔ Comprobar</button>
    <button class="btn blue" id="next">Siguiente ▶</button>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <button class="btn ghost sm" id="hint" style="width:100%">💡 Ayuda</button>
      <button class="btn ghost sm" id="reset" style="width:100%">↺ Otra vez</button>
      <button class="btn ghost sm" id="exit" style="width:100%">🏠 Salir</button>
    </div>
  </div>
</section>

<section id="s-res" class="card center hide">
  <div class="mascot big">🦊</div>
  <h2 id="rtitle"></h2>
  <div class="bigstars" id="rstars"></div>
  <p id="rtext"></p>
  <button class="btn" id="r-next">Siguiente nivel ▶</button>
  <button class="btn blue" id="r-again">Repetir</button>
  <button class="btn ghost" id="r-home">Volver al mapa</button>
</section>

</main>
<div class="conf" id="conf"></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var NP=["unidades","decenas","centenas","unidades de millar","decenas de millar"];
  var SP=["unidad","decena","centena","unidad de millar","decena de millar"];
  var LB=["U","D","C","UM","DM"];
  var COL=["#2f6fe4","#1f9d55","#d64545","#8a4fd6","#a8650a"];
  var LV=[{d:2,name:"Isla de las Unidades",icon:"🏝️"},{d:3,name:"Valle de las Centenas",icon:"🏞️"},{d:4,name:"Montaña de los Millares",icon:"⛰️"}];
  var TL={2:90,3:150,4:240};
  var KEY="sr_game_v2",P={stars:{},coins:0},mode="calm",S=null,G=null,wipeSure=false;

  function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.stars)P=d}catch(e){}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
  function sk(t,d,m){return t+d+m}
  function best(t,d){return Math.max(P.stars[sk(t,d,"calm")]||0,P.stars[sk(t,d,"time")]||0)}
  function unlocked(t,d){return d===2||best(t,d-1)>=1}
  function stars(n){return "⭐".repeat(n)+"☆".repeat(3-n)}
  function show(id){["s-home","s-play","s-res"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function digits(n){return String(n).split("").reverse().map(Number)}
  function el(cls,txt){var d=document.createElement("div");d.className=cls;if(txt!==undefined)d.textContent=txt;return d}
  function setMsg(t,k){var m=$("msg");m.textContent=t;m.className="bubble "+(k||"info")}

  function hasCarry(a,b){var x=digits(a),y=digits(b),c=0;for(var i=0;i<Math.max(x.length,y.length);i++){var s=(x[i]||0)+(y[i]||0)+c;if(s>=10)return true;c=0}return false}
  function hasBorrow(a,b){var x=digits(a),y=digits(b);for(var i=0;i<y.length;i++){if(y[i]>x[i])return true}return false}
  function make(type,d){
    var lo=Math.pow(10,d-1),hi=Math.pow(10,d)-1,want=Math.random()<0.7,a,b,t=0;
    do{
      a=rnd(lo,hi);b=rnd(lo,hi);t++;
      if(type==="sub"&&b>a){var z=a;a=b;b=z}
      if(type==="sub"&&a===b)continue;
      var f=type==="sum"?hasCarry(a,b):hasBorrow(a,b);
      if(f===want)break;
    }while(t<500);
    return {type:type,d:d,a:a,b:b,r:type==="sum"?a+b:a-b};
  }
  function tcarry(A,B,W){var r=[0],c=0;for(var i=0;i<W;i++){var t=(A[i]||0)+(B[i]||0)+c;c=t>=10?1:0;r.push(c)}return r}
  function init(c){
    var A=digits(c.a),B=digits(c.b),n=Math.max(A.length,B.length),W=c.type==="sum"?n+1:n,i,top=[],carry=[];
    for(i=0;i<W;i++)top.push(A[i]||0);
    for(i=0;i<=W;i++)carry.push(0);
    return {c:c,A:A,B:B,n:n,W:W,top:top,carry:carry,typed:[],over:false,tries:0,tc:tcarry(A,B,W)};
  }

  function render(focus){
    var b=$("board"),W=S.W,c=S.c,p,k,live=!S.over;
    b.textContent="";
    b.style.gridTemplateColumns="26px repeat("+W+",minmax(0,1fr))";
    b.appendChild(el("sg"));
    for(k=0;k<W;k++){p=W-1-k;var ch=el("chip",LB[p]);ch.style.background=COL[p];b.appendChild(ch)}
    if(c.type==="sum"){
      b.appendChild(el("sg"));
      for(k=0;k<W;k++){
        p=W-1-k;
        var tc=live&&p>=1,ce=el("cell sm"+(tc?" tap":""));
        if(S.carry[p])ce.textContent="1";
        else if(tc){var g=document.createElement("span");g.className="ghost";g.textContent="+1";ce.appendChild(g)}
        if(tc)ce.onclick=(function(q){return function(){tapCarry(q)}})(p);
        b.appendChild(ce);
      }
    }
    b.appendChild(el("sg"));
    for(k=0;k<W;k++){
      p=W-1-k;
      var v=S.top[p],isSub=c.type==="sub",blank=!isSub&&p>=S.n;
      var tp=el("cell"+(v>=10?" big2":"")+(isSub&&live&&p>=1&&v>=1?" tap":""));
      if(!blank){
        if(isSub&&v!==S.A[p])tp.appendChild(el("old",S.A[p]));
        tp.appendChild(document.createTextNode(v));
      }
      if(isSub&&live&&p>=1)tp.onclick=(function(q){return function(){tapTop(q)}})(p);
      b.appendChild(tp);
    }
    b.appendChild(el("sg",c.type==="sum"?"+":"−"));
    for(k=0;k<W;k++){p=W-1-k;b.appendChild(el("cell",p<S.B.length?String(S.B[p]):""))}
    b.appendChild(el("ln"));
    b.appendChild(el("sg"));
    for(k=0;k<W;k++){
      p=W-1-k;
      var inp=document.createElement("input");
      inp.className="cell";inp.inputMode="numeric";inp.maxLength=1;inp.autocomplete="off";
      inp.value=S.typed[p]||"";inp.disabled=!live;
      inp.oninput=(function(q){return function(){
        var v2=this.value.replace(/\D/g,"").slice(-1);this.value=v2;S.typed[q]=v2;
        if(v2){var pv=this.previousElementSibling;if(pv&&pv.tagName==="INPUT")pv.focus()}
      }})(p);
      inp.onkeydown=function(e){if(e.key==="Enter")check()};
      b.appendChild(inp);
    }
    if(focus){var all=b.querySelectorAll("input");var f=all[all.length-1];if(f)f.focus()}
  }

  function tapCarry(q){
    if(S.over)return;
    if(S.carry[q]){setMsg("Ya te llevas 1 aquí.","info");return}
    if(!S.tc[q]){setMsg("🤔 ¿Seguro? Vuelve a sumar la columna de la derecha: ¿llegas a 10 o más?","doubt");return}
    S.carry[q]=1;
    setMsg("✨ Te llevas 1 "+SP[q]+": has agrupado 10 "+NP[q-1]+" en 1 "+SP[q]+".","info");
    render(false);
  }
  function needs(q){
    if(q<0)return false;
    if(S.top[q]<(S.B[q]||0))return true;
    if(S.top[q]===0&&q>=1)return needs(q-1);
    return false;
  }
  function tapTop(p){
    if(S.over||p<1)return;
    if(S.top[p]<1){setMsg("Aquí no queda nada para desagrupar. Prueba con otra casilla de la izquierda.","info");return}
    if(!needs(p-1)){setMsg("🤔 ¿Seguro? Aquí todavía no hace falta desagrupar. Fíjate en qué columna no puedes restar.","doubt");return}
    S.top[p]--;S.top[p-1]+=10;
    setMsg("✨ Has desagrupado 1 "+SP[p]+" en 10 "+NP[p-1]+".","info");
    render(false);
  }

  function check(){
    if(S.over)return;
    var p,str="",started=false,missing=false;
    for(p=S.W-1;p>=0;p--){
      var t=S.typed[p]||"";
      if(t===""){if(started)missing=true}else{started=true;str+=t}
    }
    if(!started||missing){setMsg("✏️ Completa todas las casillas de tu resultado.","doubt");return}
    if(parseInt(str,10)===S.c.r){solved();return}
    S.tries++;
    setMsg(S.tries===1?"🤔 Mira otra vez tu operación. ¿Seguro de que todas las columnas están bien?":"🤔 Repasa cada columna empezando por las unidades. ¿Has agrupado o desagrupado donde hacía falta? Puedes usar 💡 Ayuda.","doubt");
  }

  function hint(){
    if(S.over)return;
    G.help=true;
    var m,p;
    if(S.c.type==="sum"){
      m="Empieza por las unidades y suma cada columna. Si llegas a 10 o más, agrupa 10 en 1 de la columna siguiente: escribe lo que sobra y toca la casilla de arriba de la columna de al lado para llevarte 1.";
    }else{
      for(p=0;p<S.W;p++){if(S.top[p]<(S.B[p]||0))break}
      if(p<S.W)m="En las "+NP[p]+" quieres quitar "+(S.B[p]||0)+" a "+S.top[p]+" y no se puede. Desagrupa: toca el número de la columna de la izquierda y 1 "+SP[p+1]+" se convierte en 10 "+NP[p]+". Si hay un 0, sigue desagrupando hacia la izquierda.";
      else m="Resta cada columna de derecha a izquierda y escribe el resultado debajo. Si arriba hay un número menor que el de abajo, desagrupa tocando la casilla de la izquierda.";
    }
    setMsg("💡 "+m,"info");
  }

  // ---- Misión ----
  function stopTimer(){if(G&&G.tm){clearInterval(G.tm);G.tm=null}}
  function tick(){
    var tot=TL[G.d]*1000,left=Math.max(0,G.end-Date.now());
    $("tfill").style.width=(left/tot*100)+"%";
    $("tfill").className=left/tot<0.2?"low":"";
    $("ttxt").textContent="⏱ "+Math.ceil(left/1000)+" s";
    if(left<=0&&!S.over)timeout();
  }
  function endButtons(){
    ["check","hint","reset"].forEach(function(i){$(i).classList.add("hide")});
    $("next").textContent=G.i>=5?"Ver resultado 🏁":"Siguiente ▶";
    $("next").classList.remove("hide");
  }
  function solved(){
    var left=G.mode==="time"?Math.max(0,G.end-Date.now()):0,bonus=Math.ceil(left/5000),gain=10+bonus;
    stopTimer();S.over=true;render(false);
    G.solved++;G.coins+=gain;$("pc").textContent="🪙 "+G.coins;
    setMsg("🎉 ¡Genial! "+S.c.a+(S.c.type==="sum"?" + ":" − ")+S.c.b+" = "+S.c.r+". +"+gain+" 🪙","ok");
    confetti();endButtons();
  }
  function timeout(){
    stopTimer();S.over=true;render(false);
    setMsg("⏰ ¡Se acabó el tiempo! Era "+S.c.r+". Vamos con la siguiente.","info");
    endButtons();
  }
  function nextOp(){
    G.i++;
    if(G.i>5){result();return}
    S=init(make(G.t,G.d));
    $("pop").textContent="Operación "+G.i+" de 5";
    $("pc").textContent="🪙 "+G.coins;
    ["check","hint","reset"].forEach(function(i){$(i).classList.remove("hide")});
    $("next").classList.add("hide");
    setMsg(G.t==="sum"?"¡Vamos! Empieza por las unidades (U) y ve hacia la izquierda. Si llegas a 10, toca arriba para agrupar.":"¡Vamos! Empieza por las unidades (U) y ve hacia la izquierda. Si no puedes restar, toca arriba para desagrupar.","info");
    render(true);
    if(G.mode==="time"){G.end=Date.now()+TL[G.d]*1000;G.tm=setInterval(tick,250);tick()}
  }
  function startMission(t,d){
    var L=LV[d-2];
    G={t:t,d:d,mode:mode,i:0,solved:0,help:false,coins:0,tm:null,end:0};
    $("pw").textContent=L.icon+" "+L.name;
    $("pmode").textContent=mode==="time"?"⏱ Contrarreloj":"🌱 Tranquilo";
    $("tbar").classList.toggle("hide",mode!=="time");
    show("s-play");nextOp();
  }
  function result(){
    var ok=G.solved>=3,st=!ok?0:1+(G.solved===5?1:0)+(G.solved===5&&!G.help?1:0),k=sk(G.t,G.d,G.mode);
    if(ok&&st>(P.stars[k]||0))P.stars[k]=st;
    P.coins+=G.coins;persist();
    $("rtitle").textContent=ok?"¡Misión cumplida!":"¡Casi lo consigues!";
    $("rstars").textContent=stars(st);
    $("rtext").textContent="Has resuelto "+G.solved+" de 5 operaciones y ganado "+G.coins+" 🪙."+(ok?(st<3?" Resuelve las 5 sin usar la ayuda para conseguir las 3 estrellas.":" ¡Las tres estrellas!"):" Necesitas resolver 3 para ganar una estrella. ¡Tú puedes!");
    $("r-next").classList.toggle("hide",!(ok&&G.d<4));
    show("s-res");
    if(ok)confetti();
  }

  function confetti(){
    var box=$("conf"),em=["🎉","⭐","✨","🎈","🪙"],i;
    box.textContent="";
    for(i=0;i<24;i++){var s=document.createElement("span");s.textContent=em[i%5];s.style.left=rnd(0,94)+"%";s.style.animationDelay=(Math.random()*0.6)+"s";s.style.fontSize=rnd(18,34)+"px";box.appendChild(s)}
    setTimeout(function(){box.textContent=""},2900);
  }

  // ---- Mapa ----
  function home(){
    stopTimer();
    var tot=0,k;for(k in P.stars)tot+=P.stars[k];
    $("tstars").textContent="⭐ "+tot;$("tcoins").textContent="🪙 "+P.coins;
    $("m-calm").classList.toggle("on",mode==="calm");$("m-time").classList.toggle("on",mode==="time");
    $("mdesc").textContent=mode==="calm"?"Sin prisa: piensa con calma.":"Tienes tiempo límite en cada operación. ¡Cuanto antes acabes, más monedas!";
    $("hnote").textContent="";
    [["sum","lv-sum"],["sub","lv-sub"]].forEach(function(w){
      var box=$(w[1]);box.textContent="";
      LV.forEach(function(L){
        var u=unlocked(w[0],L.d),st=P.stars[sk(w[0],L.d,mode)]||0,b=document.createElement("button");
        b.className="lv"+(u?"":" lock");
        b.innerHTML='<span class="ic">'+(u?L.icon:"🔒")+'</span><b>Nivel '+(L.d-1)+'</b><small>'+L.d+' cifras</small><span class="stl">'+(u?stars(st):"")+'</span>';
        b.onclick=function(){
          if(!u){$("hnote").textContent="Consigue una estrella en el nivel anterior para abrir este.";return}
          startMission(w[0],L.d);
        };
        box.appendChild(b);
      });
    });
    show("s-home");
  }

  $("m-calm").onclick=function(){mode="calm";home()};
  $("m-time").onclick=function(){mode="time";home()};
  $("check").onclick=check;
  $("hint").onclick=hint;
  $("reset").onclick=function(){if(S.over)return;var f=S.tries;S=init(S.c);S.tries=f;setMsg("Empezamos de nuevo con la misma operación.","info");render(true)};
  $("next").onclick=nextOp;
  $("exit").onclick=function(){stopTimer();home()};
  $("r-home").onclick=home;
  $("r-again").onclick=function(){startMission(G.t,G.d)};
  $("r-next").onclick=function(){startMission(G.t,G.d+1)};
  $("wipe").onclick=function(){
    if(!wipeSure){wipeSure=true;$("wipe").textContent="¿Seguro? Toca otra vez";return}
    wipeSure=false;P={stars:{},coins:0};persist();$("wipe").textContent="Borrar mi progreso";home();
  };

  load();home();
})();
</script>
